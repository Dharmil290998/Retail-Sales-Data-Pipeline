name: Deploy ADF

on:
  push:
    branches:
      - adf_publish
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout MAIN (workflow file lives here)
      - name: Checkout main
        uses: actions/checkout@v4

      # Checkout ADF PUBLISH (ARM templates live here)
      - name: Checkout adf_publish branch
        uses: actions/checkout@v4
        with:
          ref: adf_publish
          path: adf_publish

      # Azure Login
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Deploy ARM Template
      - name: Deploy ARM Template
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ secrets.AZURE_RESOURCE_GROUP }}
          template: ./adf_publish/ARMTemplateForFactory.json
          parameters: >
            ./adf_publish/ARMTemplateParametersForFactory.json
            factoryName=${{ secrets.ADF_FACTORY_NAME }}
          deploymentName: adf-deployment
